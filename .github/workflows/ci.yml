name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'resources/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'postcss.config.cjs'
      - 'phpunit.xml'
      - 'phpstan.neon.dist'
      - 'testbench.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'resources/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'postcss.config.cjs'
      - 'phpunit.xml'
      - 'phpstan.neon.dist'
      - 'testbench.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, dom
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, dom
          # pcov is far faster than xdebug and only line coverage is needed.
          coverage: pcov
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with a coverage floor
        # Ratchet this floor to the measured baseline; it must never be lowered
        # to make a build pass. The percentage is printed to the log on every
        # run, so the first green build confirms the floor and any later number
        # is visible without downloading the artifact.
        run: composer test-coverage -- --min=90 --coverage-text=php://stdout

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage
          retention-days: 7
          if-no-files-found: warn

  static-analysis:
    name: Static analysis and code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, dom
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-static-${{ hashFiles('composer.json') }}
          restore-keys: composer-static-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Audit dependencies for known vulnerabilities
        # Dev-only dependencies are included on purpose: a vulnerability in the
        # toolchain is still a vulnerability in the build.
        run: composer audit

      - name: Check code style
        run: composer lint

      - name: Run static analysis
        run: composer analyse

  stylesheets:
    name: Stylesheets are built
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the stylesheets
        run: npm run css:dist

      - name: Fail when the build is not committed
        # resources/css/dist ships, so it has to match resources/css/src. Running
        # the build here and diffing is the only way to know it does.
        run: |
          if ! git diff --exit-code -- resources/css/dist; then
            echo "::error::resources/css/dist is out of date. Run 'npm run css:dist' and commit the result."
            exit 1
          fi
